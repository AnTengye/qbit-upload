dest_dir: D:/downloads/done
password: your-password
# Optional. Leave empty to prefer embedded official 7-Zip, then PATH.
# seven_zip: 7zz
min_size_mb: 50
reserve_memory_mb: 2048

archive:
  allow_tgz_fallback: true
  embedded_7z_dir: tools
  # Optional. Leave empty to use the OS temp directory.
  temp_dir: ""
  # Set true to create one archive per matched video file.
  split: false
  # Set false to keep the source video files/directory after compression.
  delete_source: true
  # Optional. Dedicated output directory for archives. Defaults to dest_dir.
  dest_dir: ""

watch:
  enabled: false
  dirs:
    - D:/downloads/incoming
  stable_delay: 30s
  poll_interval: 5s

# Background download filtering runs alongside packaging/upload in `qbit-upload watch`.
# Only tagged tasks are managed. This threshold is independent of min_size_mb above.
torrent_filter:
  # Set true to include filtering in the existing qbit-upload service.
  enabled: false
  base_url: http://127.0.0.1:8080
  username: ""
  # Prefer QBIT_UPLOAD_QBITTORRENT_PASSWORD instead of storing the password here.
  # password: ""
  # MiB (1024 * 1024 bytes). Smaller files are skipped; equal-sized files are kept.
  min_size_mb: 100
  tag: filter-small
  poll_interval: 5s
  retry_interval: 30s
  request_timeout: 10s
  # Optional. Defaults to the current user's config directory/qbit-upload/torrent-filter.
  # On the NAS, use an absolute path such as /var/lib/qbit-upload/torrent-filter.
  state_dir: ""

# Automatic stalled-download rescue. Uses torrent_filter's WebUI connection and
# credentials, with its own tag/worker; candidates never use filter-small.
# See docs/torrent-rescue.md before enabling the completion hook.
# After verified publication, other unfinished group members and their data are
# deleted; the group's persisted candidate records retain only the winner.
torrent_rescue:
  enabled: false
  rss_url: https://sukebei.nyaa.si/
  proxy_url: "" # HTTP/SOCKS proxy for search only; or QBIT_UPLOAD_SEARCH_PROXY.
  poll_interval: 15m
  min_age: 240h
  search_interval: 24h
  search_timeout: 30s
  metadata_timeout: 1h
  poor_score_after: 6h
  min_runtime_score: 40
  trial_timeout: 24h
  cooldown: 168h
  max_per_code: 3
  max_active: 6
  max_candidates: 10
  search_batch: 2
  storage_budget_gb: 200 # GiB, including retained failed/winner candidate files.
  min_free_gb: 20
  min_video_size_mb: 100
  preferred_video_size_gb: 4 # GiB of the verified film, not torrent total size.
  ideal_video_size_gb: 20 # Prefer films within +/-20%; smaller copies are fallback.
  min_video_duration: 1m
  min_video_height: 720
  category: qbit-rescue
  state_dir: "" # NAS example: /var/lib/qbit-upload/torrent-rescue
  guard_dir: "" # Host directory mounted as /config/qbit-rescue/guards.
  hook_path: /config/qbit-rescue-hook.py
  download_path_prefix: /downloads
  download_host_dir: "" # Host side of the /downloads container mount.
  candidate_save_path: /downloads/qbit-rescue
  publish_dir: "" # A dedicated existing watch.dirs entry (not its parent).

thumbnail:
  enabled: true
  ffmpeg: ffmpeg
  ffprobe: ffprobe
  columns: 4
  rows: 15
  width: 320
  # Optional. Dedicated output directory for thumbnails. Defaults to dest_dir.
  dest_dir: ""

# Enabled by default. Reports the normalized catalog number and generated preview.
report:
  enabled: true
  url: http://89.116.88.182:8081/api/external/films
  timeout: 30s
  # Prefer QBIT_UPLOAD_REPORT_API_KEY instead of storing the key in this file.
  # api_key: ""

log:
  path: logs
  also_stdout: true

# Move -> native upload -> report status=5 -> delete local archive.
# Enable on the NAS; see docs/native-baidu-upload.md for credentials and TLS.
upload:
  enabled: false
  base_url: https://127.0.0.1:9443
  username: ""
  certificate_sha256: ""
  remote_dir: /绿联网盘
  state_dir: ""
  task_db: /volume1/@appstore/com.ugreen.netdisk/db/net_disk.db
  sqlite: sqlite3
  timeout: 24h
  poll_interval: 5s
  retry_interval: 12h
